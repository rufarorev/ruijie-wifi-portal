<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Ruijie Wi-Fi Portal</title>
    <meta name="viewport" content="initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" href="./img/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="./css/index.css" />
  </head>

  <body>
    <div class="body-loading" id="body_loading" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;text-align:center;z-index:2;">
      <span style="display:inline-block;margin-top:30%;color:#333;font-family:Arial,Helvetica,sans-serif;font-size:16px;">Loading...</span>
    </div>

    <div class="body-wrapper">
      <div class="body-background">
        <div class="body-background-mask"></div>
      </div>

      <div class="body-content-wrapper">
        <div class="body-content" id="body_content">
          <div class="content-decoration-wrapper">
            <div class="content-logo-wrapper">
              <img class="content-logo" src="./img/logo.png" width="140" height="46" alt="" />
            </div>
          </div>

          <div class="login-wrapper">
            <div class="login-inner">
              <div class="login-inner-cell">
                <div class="login-form-wrapper">
                  <div class="login-form-title"></div>
                  <div class="login-item login-item-fixaccount hide">
                    <input class="rj-input" type="text" id="account_input" data-i18n-placeholder="account" />
                  </div>
                  <div class="login-item login-item-fixaccount hide">
                    <input class="rj-input" type="password" id="account_password" data-i18n-placeholder="password" />
                  </div>
                  <div class="login-item login-item-voucher hide">
                    <input class="rj-input" type="text" id="voucher_code" data-i18n-placeholder="accesscode" />
                  </div>
                </div>

                <div class="login-msg" id="login_msg"></div>
                <button type="button" class="rj-btn rj-btn-primary login-btn" id="login_btn" data-i18n="login"></button>

                <div class="other-btn-wrapper">
                  <div class="login-split-line hide" id="login_split_line">
                    <span class="left"></span>
                    <span class="or-label" data-i18n="or"></span>
                    <span class="right"></span>
                  </div>
                  <button type="button" class="rj-btn login-item login-item-pass hide" onclick="IndexObj.changeLoginOption('pass')" data-i18n="one_click_login"></button>
                  <button type="button" class="rj-btn login-item login-item-fixaccount hide" onclick="IndexObj.changeLoginOption('fixaccount')" data-i18n="account_login"></button>
                  <button type="button" class="rj-btn login-item login-item-voucher hide" onclick="IndexObj.changeLoginOption('voucher')" data-i18n="voucher_login"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="./js/language.js"></script>
    <script type="text/javascript" src="./js/i18n/i18n.js"></script>
    <script type="text/javascript" src="./js/index.js"></script>
    <script type="text/javascript" src="./loadConfig.json"></script>
  </body>
</html>
